[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqrun-qc"
version = "0.2.0"
description = "Validate paired-end sample sheets and report pipeline file status"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
seqrun-qc = "seqrun_qc.cli:main"
